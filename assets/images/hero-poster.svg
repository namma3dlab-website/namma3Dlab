<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1017"/>
      <stop offset="50%" stop-color="#111722"/>
      <stop offset="100%" stop-color="#070a0e"/>
    </linearGradient>
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8DC63F"/>
      <stop offset="100%" stop-color="#4D8014"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <radialGradient id="nozzleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8DC63F" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#8DC63F" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  <rect width="800" height="600" fill="url(#grid)"/>

  <!-- Print Bed Isometric Plane -->
  <g transform="translate(100, 360)">
    <polygon points="300,-120 550,20 250,140 0,0" fill="#141B26" stroke="#253245" stroke-width="2"/>
    <polygon points="295,-115 540,20 250,135 10,0" fill="none" stroke="rgba(141,198,63,0.15)" stroke-width="1"/>
    
    <!-- Coordinate Grid on Bed -->
    <path d="M 125,70 L 375,-50 M 180,95 L 430,-25 M 65,35 L 315,-85" stroke="rgba(0,229,255,0.1)" stroke-width="1" stroke-dasharray="3,3"/>
  </g>

  <!-- 3D Printed Object Forming (Spiral Geometric Vase / Voronoi) -->
  <g transform="translate(400, 320)">
    <!-- Base layers -->
    <ellipse cx="0" cy="80" rx="90" ry="35" fill="#182333" stroke="url(#limeGrad)" stroke-width="3"/>
    <ellipse cx="0" cy="65" rx="85" ry="32" fill="#192638" stroke="url(#limeGrad)" stroke-width="2.5" opacity="0.9"/>
    <ellipse cx="0" cy="50" rx="80" ry="30" fill="#1C2B3F" stroke="url(#limeGrad)" stroke-width="2.5" opacity="0.85"/>
    <ellipse cx="0" cy="35" rx="74" ry="28" fill="#1F3047" stroke="url(#limeGrad)" stroke-width="2.5" opacity="0.8"/>
    <ellipse cx="0" cy="20" rx="68" ry="26" fill="#223650" stroke="url(#limeGrad)" stroke-width="2.5" opacity="0.85"/>
    <ellipse cx="0" cy="5" rx="64" ry="24" fill="#243C59" stroke="url(#limeGrad)" stroke-width="2.5" opacity="0.9"/>
    <ellipse cx="0" cy="-10" rx="60" ry="23" fill="#274263" stroke="url(#limeGrad)" stroke-width="2.5" opacity="0.95"/>
    <ellipse cx="0" cy="-25" rx="58" ry="22" fill="#2B496D" stroke="#8DC63F" stroke-width="3"/>

    <!-- Active Printing Layer Glow -->
    <ellipse cx="0" cy="-25" rx="58" ry="22" fill="none" stroke="#00E5FF" stroke-width="3" stroke-dasharray="8,4"/>
  </g>

  <!-- Extruder & Toolhead Assembly -->
  <g transform="translate(400, 190)">
    <!-- Nozzle Heat Glow -->
    <circle cx="0" cy="85" r="30" fill="url(#nozzleGlow)"/>
    
    <!-- Brass Nozzle -->
    <polygon points="-8,70 8,70 2,85 -2,85" fill="#D97706" stroke="#F59E0B" stroke-width="1"/>
    
    <!-- Hotend Heater Block -->
    <rect x="-24" y="45" width="48" height="25" rx="3" fill="#334155" stroke="#64748B" stroke-width="1.5"/>
    <circle cx="12" cy="57" r="3" fill="#EF4444"/> <!-- Thermistor / Heater LED -->
    
    <!-- Heatsink Cooling Fins -->
    <rect x="-18" y="5" width="36" height="40" rx="2" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
    <line x1="-18" y1="13" x2="18" y2="13" stroke="#00E5FF" stroke-width="1" opacity="0.5"/>
    <line x1="-18" y1="21" x2="18" y2="21" stroke="#00E5FF" stroke-width="1" opacity="0.5"/>
    <line x1="-18" y1="29" x2="18" y2="29" stroke="#00E5FF" stroke-width="1" opacity="0.5"/>
    <line x1="-18" y1="37" x2="18" y2="37" stroke="#00E5FF" stroke-width="1" opacity="0.5"/>
    
    <!-- Extruder Direct Drive Body -->
    <rect x="-35" y="-55" width="70" height="60" rx="6" fill="#0F172A" stroke="#334155" stroke-width="2"/>
    <!-- NEMA 17 Stepper Motor Back -->
    <rect x="-30" y="-50" width="60" height="30" rx="3" fill="#1E293B"/>
    <circle cx="0" cy="-35" r="8" fill="#334155"/>

    <!-- Filament Strand entering extruder -->
    <line x1="0" y1="-120" x2="0" y2="-55" stroke="#8DC63F" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Gantry Rods & Linear Rails -->
  <g>
    <line x1="120" y1="165" x2="680" y2="165" stroke="#475569" stroke-width="5" stroke-linecap="round"/>
    <line x1="120" y1="185" x2="680" y2="185" stroke="#334155" stroke-width="5" stroke-linecap="round"/>
    <circle cx="400" cy="165" r="6" fill="#8DC63F"/>
  </g>

  <!-- Realtime HUD / Telemetry Overlay in SVG -->
  <g transform="translate(50, 45)">
    <rect width="180" height="65" rx="8" fill="rgba(12,16,23,0.8)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <circle cx="20" cy="22" r="5" fill="#8DC63F"/>
    <text x="32" y="26" fill="#8DC63F" font-family="monospace" font-size="12" font-weight="bold">EXTRUDING 215°C</text>
    <text x="20" y="48" fill="#94A3B8" font-family="monospace" font-size="11">BED: 60°C | LAYER: 142</text>
  </g>

  <g transform="translate(570, 45)">
    <rect width="180" height="65" rx="8" fill="rgba(12,16,23,0.8)" stroke="rgba(0,229,255,0.3)" stroke-width="1"/>
    <text x="20" y="26" fill="#00E5FF" font-family="monospace" font-size="12" font-weight="bold">SPEED: 180 mm/s</text>
    <text x="20" y="48" fill="#94A3B8" font-family="monospace" font-size="11">TOLERANCE: ±0.1mm</text>
  </g>
</svg>
